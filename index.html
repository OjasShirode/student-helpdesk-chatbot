<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Skillinf Student Helpdesk</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Space Grotesk', 'Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    };
  </script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="app mx-auto flex h-full w-full max-w-3xl flex-col overflow-hidden md:rounded-3xl" aria-label="Skillinf Student Helpdesk">

    <header class="app-header gutter flex shrink-0 items-center gap-3 py-3.5">
      <div class="logo flex h-11 w-11 shrink-0 items-center justify-center rounded-xl font-display text-xl font-bold" aria-hidden="true">S</div>
      <div class="min-w-0 flex-1">
        <h1 class="truncate font-display text-[17px] font-semibold leading-tight">Skillinf Student Helpdesk</h1>
        <p class="header-sub flex items-center gap-1.5 text-xs" aria-live="polite">
          <span class="status-dot inline-block h-2 w-2 rounded-full"></span>
          <span id="statusText">Online · replies instantly</span>
        </p>
      </div>

      <button id="themeBtn" type="button" class="hbtn flex h-9 w-9 items-center justify-center rounded-lg" aria-label="Toggle dark mode" title="Toggle dark mode">
        <span id="sunIcon" hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        </span>
        <span id="moonIcon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </span>
      </button>

      <button id="resetBtn" type="button" class="hbtn flex h-9 items-center gap-1.5 rounded-lg px-3 text-sm font-medium" aria-label="New chat" title="Start a new conversation">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>
        <span class="hidden sm:inline">New chat</span>
      </button>
    </header>

    <nav class="chips-band gutter shrink-0 py-2.5" aria-label="Quick questions">
      <div id="chipRail" class="chips-rail flex gap-2 overflow-x-auto"></div>
    </nav>

    <div class="relative min-h-0 flex-1">
      <section id="chatLog" class="chat-bg gutter h-full overflow-y-auto py-5" role="log" aria-live="polite" aria-label="Conversation">

        <div id="welcome" class="msg-in flex flex-col gap-5 pb-4">
          <div class="flex items-center gap-3">
            <div class="brand-mark flex h-10 w-10 shrink-0 items-center justify-center rounded-xl font-display text-lg font-bold" aria-hidden="true">S</div>
            <div>
              <h2 class="font-display text-2xl font-semibold leading-tight">How can we help today?</h2>
              <p class="muted mt-0.5 text-sm">Choose a topic or type your own question. Answers are instant, any time of day.</p>
            </div>
          </div>
          <div id="topicGrid" class="grid grid-cols-1 gap-3 sm:grid-cols-2"></div>
        </div>

        <div id="messages" class="flex flex-col gap-4"></div>
      </section>

      <button id="toBottom" type="button" class="to-bottom flex h-10 w-10 items-center justify-center rounded-full" aria-label="Scroll to latest message" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
      </button>
    </div>

    <form id="chatForm" class="input-band gutter shrink-0 py-3" autocomplete="off">
      <div class="composer flex items-center gap-2 rounded-2xl p-1.5 pl-4">
        <label for="chatInput" class="sr-only">Type your question</label>
        <input id="chatInput" type="text" maxlength="300"
               placeholder="Ask about courses, internships, deadlines or certificates"
               class="min-w-0 flex-1 bg-transparent py-2 text-[15px] outline-none">
        <button id="sendBtn" type="submit" class="send flex h-10 w-10 shrink-0 items-center justify-center rounded-xl" aria-label="Send message" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
        </button>
      </div>
      <div class="muted mt-1.5 flex items-center justify-between px-1 text-xs">
        <span>Press Enter to send · demo answers use sample data</span>
        <span id="counter" class="counter">0 / 300</span>
      </div>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
